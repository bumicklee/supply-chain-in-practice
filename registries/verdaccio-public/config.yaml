storage: /verdaccio/storage
web:
  enable: false
auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    cache: true
packages:
  'price-rules':
    access: $all
    publish: $all
  'string-padder':
    access: $all
    publish: $all
  'string-paddr':
    access: $all
    publish: $all
  '@parts/*':
    access: $all
    publish: $all
  '**':
    access: $all
    publish: $authenticated
    proxy: npmjs
log:
  type: stdout
  format: pretty
  level: warn

